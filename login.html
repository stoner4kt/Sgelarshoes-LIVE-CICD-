<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Primary SEO Meta Tags -->
    <title>Login | SGELAR School Shoes Account</title>
    <meta name="description" content="Login to your SGELAR account to track orders, manage your profile, and access exclusive deals on school shoes.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.sgelarshoes.co.za/login.html">
    
    <!-- Mobile -->
    <meta name="theme-color" content="#FDB913">
    
    <!-- Google Search Console -->
    <meta name="google-site-verification" content="TBwJOmcvM3ZPL9ssExkVcPNdELqMndwl4jRJr3uIiqY" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #111;
            border-radius: 12px;
            border-top: 4px solid var(--yellow);
        }
        .auth-box h2 {
            color: var(--yellow);
            margin-bottom: 30px;
            text-align: center;
        }
        .auth-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }
        .auth-box button {
            width: 100%;
            padding: 14px;
            background: var(--yellow);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .auth-box button:hover {
            background: #e6c200;
        }
        .auth-box p {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .auth-box a {
            color: var(--yellow);
            cursor: pointer;
        }
        .auth-logo {
            display: block;
            margin: 0 auto 20px;
            height: 50px;
        }
    </style>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q0FD7RSMQQ"></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6LfWg0csAAAAAJF90OmpPN6hisFTcV0K4G0z7gHM" async defer></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Q0FD7RSMQQ', {
            'send_page_view': true,
            'page_title': 'Login'
        });
    </script>
</head>
<body>
    <main>
        <div class="auth-box">
            <div class="auth-header">
                <img src="assets/img/logo.png" alt="SGELAR Logo" class="auth-logo" width="auto" height="50">
                <h1 id="authTitle" style="font-size: 1.8rem;">Login</h1>
                <p id="authSubtitle">Enter your credentials to access your account.</p>
            </div>

            <form class="form-container" onsubmit="return false;">
                <div class="input-group">
                    <label for="email" class="sr-only">Email Address</label>
                    <input type="email" id="email" placeholder="Email address" required aria-required="true" autocomplete="email"/>
                </div>
                <div class="input-group">
                    <label for="password" class="sr-only">Password</label>
                    <input type="password" id="password" placeholder="Password" required aria-required="true" autocomplete="current-password"/>
                    <div style="text-align: right; margin-top: 5px;">
                        <a onclick="forgotPassword()" style="font-size: 0.8rem; color: #888; cursor: pointer;">Forgot Password?</a>
                    </div>
                </div>

                <button id="loginBtn" class="auth-main-btn" onclick="login()" type="button">Login</button>
                <button id="signupBtn" class="auth-main-btn" style="display: none;" onclick="signup()" type="button">Create Account</button>

                <div class="auth-toggle">
                    <p id="toggleText">No account? <a onclick="toggleAuth(true)" style="cursor: pointer;">Sign up here</a></p>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
